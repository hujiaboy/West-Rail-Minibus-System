<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>西鐵小巴系統</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚐</text></svg>">
<!-- 引入 Firebase Auth 用於 Google 官方安全 Popup 登入 -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ua-parser-js@1.0.37/dist/ua-parser.min.js"></script>
<style>
:root{--bg:#0f0f0f;--card:#1c1c1e;--gold:#fc0;--blue:#0a84ff;--red:#ff453a;--green:#30d158;--purple:#bf5af2;--orange:#ff9500;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{padding:10px;text-align:center;border-bottom:1px solid #333;flex-shrink:0;position:relative}
.title{font-size:32px;font-weight:800;color:var(--gold)}
.dev-tag{font-size:16px;color:#aaa;cursor:pointer}
.global-voice-toggle{position:absolute;top:8px;right:10px;width:52px;height:52px;border-radius:50%;background:var(--green);border:none;color:#fff;font-size:26px;cursor:pointer}
.global-voice-toggle.muted{background:var(--red)}
.view{display:none;flex:1;overflow-y:auto;padding:12px;flex-direction:column}
.view.active{display:flex}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid #333}
.btn{width:100%;padding:18px;border-radius:16px;font-size:24px;font-weight:700;border:none;cursor:pointer;color:#fff;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:active{opacity:.8;transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-portal{background:linear-gradient(135deg,#0a84ff,#06c)}
.btn-driver{background:linear-gradient(135deg,#ff453a,#c62828)}
.btn-secondary{background:#3a3a3c}
.btn-warn{background:#ff9f0a;color:#000}
.btn-green{background:var(--green)}
.btn-red{background:var(--red)}
.btn-purple{background:var(--purple)}
.btn-google{background:#fff;color:#000;border:1px solid #ddd}
.row{display:flex;gap:12px;margin-bottom:10px}
.row>*{flex:1}
.badge{display:inline-block;padding:8px 20px;border-radius:20px;font-weight:700;font-size:18px;margin:4px}
.badge-red{background:var(--red)}
.badge-blue{background:var(--blue)}
.badge-purple{background:var(--purple)}
.big-number{font-size:56px;font-weight:800;text-align:center;margin:4px 0;color:var(--gold)}
.station-name{font-size:32px;font-weight:700;text-align:center;margin:4px 0;color:var(--gold)}
.msg-area{background:#1a1a1a;border-radius:14px;padding:12px;margin-top:8px}
.msg-list{max-height:200px;overflow-y:auto;margin-bottom:8px;font-size:16px;display:flex;flex-direction:column;overflow-anchor:auto}
.msg-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #333;flex-wrap:wrap}
.msg-input{flex:1;padding:14px;border-radius:12px;border:none;font-size:18px;background:#2c2c2e;color:#fff;min-width:100px}
.record-btn,.send-btn{width:56px;height:56px;border-radius:14px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative}
.record-btn{background:#ff9f0a;color:#000;font-size:26px}
.record-btn.recording{background:red;color:#fff;animation:pulse .6s infinite}
.send-btn{background:var(--blue);color:#fff;font-size:18px;font-weight:700}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 28px;border-radius:30px;font-size:18px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.login-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login-modal.active{display:flex}
.login-card{background:#1c1c1e;border:2px solid var(--gold);border-radius:20px;padding:24px;max-width:400px;width:100%;text-align:center}
.login-card input{width:100%;padding:16px;margin:8px 0;border-radius:12px;border:none;font-size:20px;background:#2c2c2e;color:#fff}
.login-card .btn{font-size:22px;padding:16px}
.login-card .btn-secondary{background:#3a3a3c;color:#fff;margin-top:8px}
.route-strip{display:flex;overflow-x:auto;gap:14px;padding:16px 10px;border-top:2px solid #555;margin-top:12px;background:rgba(255,255,255,0.05);border-radius:12px;min-height:80px;scroll-behavior:smooth;align-items:center}
.dot-node{flex:0 0 180px;text-align:center;font-size:18px;transition:all .3s;white-space:nowrap;overflow:visible;flex-shrink:0;padding:4px 0}
.dot{width:32px;height:32px;border-radius:50%;background:#444;margin:0 auto 6px;border:3px solid #666;transition:all .3s}
.dot-node.current .dot{background:#00ff66;box-shadow:0 0 24px #00ff66;border-color:#fff;transform:scale(1.15)}
.dot-node.current span{color:#fff;font-weight:800;font-size:20px}
.dot-node.next .dot{background:#00ff66;animation:blink .8s infinite;border-color:#fff}
.dot-node.next span{color:#00ff66;font-weight:700}
.dot-node.passed .dot{background:#666;border-color:#888;opacity:.5}
.dot-node.passed span{color:#888}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.9)}}
.play-audio{background:var(--blue);color:#fff;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:15px}
.walkie-talkie{background:#2c1a3a;border:2px solid var(--gold);border-radius:16px;padding:16px;margin-top:8px}
.walkie-talkie .btn{font-size:28px;padding:20px}
.walkie-talkie .record-btn{width:72px;height:72px;font-size:32px}
.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.admin-tab{flex:1;min-width:70px;padding:12px 8px;background:#2c2c2e;border:none;color:#888;border-radius:12px;cursor:pointer;font-size:16px;font-weight:700;transition:.3s}
.admin-tab.active{background:var(--gold);color:#000}
.admin-section{display:none}
.admin-section.active{display:block}
.admin-stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.admin-stat-card{background:#2c2c2e;border-radius:12px;padding:12px;text-align:center}
.admin-stat-card .label{font-size:14px;color:#888}
.admin-stat-card .value{font-size:28px;font-weight:800;color:var(--gold)}
.admin-item{background:#2c2c2e;border-radius:10px;padding:12px;margin-bottom:8px;border-left:3px solid var(--blue)}
.admin-item .title{font-size:18px;font-weight:700;color:var(--gold)}
.admin-item .info{font-size:15px;color:#ccc}
.admin-input{flex:1;padding:14px;border-radius:10px;border:none;font-size:18px;background:#2c2c2e;color:#fff;min-width:60px}
.admin-role-badge{background:#ff9f0a;color:#000;padding:4px 12px;border-radius:12px;font-size:14px;font-weight:bold;display:inline-block;margin-left:8px}
.gps-debug{background:#1a1a1a;border-radius:8px;padding:8px 12px;margin-top:6px;font-size:14px;color:#aaa;border:1px solid #333;word-break:break-all}
</style>
</head>
<body>
<div class="header"><div class="title">西鐵小巴系統</div><div class="dev-tag">開發者-大輝</div><button class="global-voice-toggle" id="global-voice-btn">🔊</button></div>

<div class="login-modal" id="login-modal">
  <div class="login-card">
    <h2 style="color:var(--gold);margin-bottom:16px;font-size:28px;">🔐 登入</h2>
    <div id="login-choice">
      <button class="btn btn-google" id="login-google" style="font-size:20px;padding:14px;">🅶 管理員 Google 登入</button>
      <button class="btn btn-driver" id="login-driver" style="font-size:20px;padding:14px;">🚏 司機登入</button>
      <button class="btn btn-portal" id="login-passenger" style="font-size:20px;padding:14px;">🧍 乘客登入</button>
    </div>
    <div id="driver-login-form" style="display:none;">
      <input type="text" id="driver-identifier" placeholder="電郵 或 電話號碼">
      <button class="btn btn-green" id="driver-login-btn">確認登入</button>
      <button class="btn btn-secondary" id="driver-login-back">返回</button>
      <div id="driver-login-error" style="color:var(--red);margin-top:8px;"></div>
    </div>
    <div id="passenger-login-form" style="display:none;">
      <input type="tel" id="passenger-phone" placeholder="電話號碼 (8位數字)">
      <button class="btn btn-portal" id="passenger-login-btn">確認登入</button>
      <button class="btn btn-secondary" id="passenger-login-back">返回</button>
      <div id="passenger-login-error" style="color:var(--red);margin-top:8px;"></div>
    </div>
    <button class="btn btn-secondary" id="login-cancel" style="font-size:18px;padding:12px;margin-top:6px;">取消</button>
  </div>
</div>

<div id="view-lobby" class="view active">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:22px;font-weight:bold;color:var(--gold);">📋 使用說明</span>
      <button class="btn" style="width:auto;padding:10px 20px;background:var(--gold);color:#000;font-size:18px;" id="btn-guide-voice">🔊 聆聽教學</button>
    </div>
    <div style="margin-top:10px;color:#ccc;line-height:1.8;font-size:17px;">
      🚏 司機：登入→輸入車牌→開始當值→真實GPS自動報站<br>
      🧍 乘客：登入→揀車追蹤→開啟報站→自動同步語音<br>
      🎙️ 對講機：司機之間／管理員與司機即時通話
    </div>
  </div>
  <button class="btn btn-portal" id="btn-passenger" style="font-size:26px;padding:20px;">🧍 乘客入口</button>
  <button class="btn btn-driver" id="btn-driver" style="font-size:26px;padding:20px;">🚏 司機入口</button>
  <button class="btn btn-purple" id="btn-admin-panel" style="display:none;font-size:24px;padding:18px;">👑 總管後台</button>
  <button class="btn btn-secondary" id="btn-logout" style="font-size:22px;padding:18px;">🚪 登出</button>
</div>

<div id="view-passenger-list" class="view">
  <h2 style="text-align:center;font-size:24px;">🚐 線上小巴</h2>
  <div id="bus-list-container" style="margin:8px 0;font-size:18px;">載入中…</div>
  <button class="btn btn-secondary" id="btn-back-list" style="font-size:22px;padding:18px;">返回大堂</button>
</div>

<div id="view-passenger" class="view">
  <button id="voice-toggle" class="btn" style="background:#ff9f0a;color:#000;font-size:28px;padding:20px;min-height:80px;">🔊 開啟廣東話自動報站</button>
  <div class="card" id="pass-data-card" style="font-size:18px;">讀取中…</div>
  <div class="route-strip" id="pass-route-strip"></div>
  <button class="btn btn-secondary" id="btn-back-track" style="font-size:22px;padding:18px;">返回列表</button>
</div>

<div id="view-driver" class="view">
  <div class="card" style="text-align:center;padding:14px;">
    <div style="font-size:18px;color:#aaa;" id="d-info">🚐 未登入 | 司機: -</div>
    <div class="station-name" id="d-station">大棠黃泥墩</div>
    <div class="target-station" id="d-target" style="font-size:20px;color:var(--gold);">下一站：大棠山路巴士站</div>
    <div id="d-gps-status" style="font-size:16px;color:#888;margin-top:4px;">📍 GPS 定位中...</div>
    <div id="gps-debug" class="gps-debug" style="display:none;"></div>
  </div>
  <div class="card" style="text-align:center;padding:12px;">
    <div style="font-size:20px;color:#aaa;">目前乘客</div>
    <div class="big-number" id="d-pass-count">0</div>
    <div class="row">
      <button class="btn btn-green" id="btn-add-pass" style="font-size:28px;padding:16px;">＋ 乘客</button>
      <button class="btn btn-red" id="btn-sub-pass" style="font-size:28px;padding:16px;">－ 乘客</button>
    </div>
  </div>
  <div class="row">
    <input id="driver-plate-input" class="admin-input" placeholder="輸入車牌號碼" style="flex:2;">
    <button class="btn btn-green" id="btn-set-plate" style="width:auto;padding:10px 20px;font-size:18px;">設定車牌</button>
  </div>
  <button class="btn btn-green" id="start-gps" style="font-size:24px;padding:18px;">🟢 開始當值 (GPS)</button>
  <button class="btn btn-red" id="stop-gps" style="font-size:24px;padding:18px;display:none;">🔴 停止當值</button>
  <div class="route-strip" id="d-route-strip"></div>
  <button class="btn btn-secondary" id="btn-driver-back" style="font-size:22px;padding:18px;">返回大堂</button>
</div>

<div id="view-admin" class="view">
  <div class="card" style="border:2px solid var(--gold);background:#1a0a2e;">
    <h2 style="color:var(--gold);text-align:center;font-size:26px;">🛡️ 總管後台 <span id="admin-role-badge" class="admin-role-badge" style="display:none;">👁️ 管理員</span></h2>
    <div id="admin-info-card" style="margin-top:12px;color:#ccc;"></div>
  </div>
  <button class="btn btn-secondary" id="btn-back-admin" style="font-size:22px;padding:18px;">返回大堂</button>
</div>

<div id="toast" class="toast"></div>

<script>
console.log('🔵 西鐵小巴系統 啟動');

// Firebase 專屬 Config（確保 Google 安全彈窗能 100% 登入成功）
const firebaseConfig = {
  apiKey: "AIzaSyCnToMYsM7pIGeGHLt5xFbQfT5RAIWzTQA",
  authDomain: "van-v9-41439.firebaseapp.com",
  databaseURL: "https://van-v9-41439-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "van-v9-41439",
  storageBucket: "van-v9-41439.firebasestorage.app",
  messagingSenderId: "434506286219",
  appId: "1:434506286219:web:00a57d319da5c6cc4fc08e"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// 對接 Cloudflare Functions / D1 API
const api = {
  async getBuses() {
    try { const res = await fetch('/api/buses'); return await res.json(); } catch(e){ return []; }
  },
  async updateBus(data) {
    try {
      await fetch('/api/buses/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    } catch(e){}
  },
  async getMessages() {
    try { const res = await fetch('/api/messages'); return await res.json(); } catch(e){ return []; }
  },
  async sendMessage(data) {
    try {
      await fetch('/api/messages/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
    } catch(e){}
  },
  async getSuperAdmins() {
    try { const res = await fetch('/api/super_admins'); return await res.json(); } catch(e){ return []; }
  }
};

const SUPER_ADMIN_EMAILS = ['cheungyiufai1810@gmail.com', 'hujiaboy@gmail.com'];
let currentUser = { uid: null, identifier: null, role: 'passenger', email: null };
let isSuperAdmin = false, isAdmin = false;
let driverData = { mode: 'busy', direction: 0, stationIndex: 0, passengerCount: 0, isActive: false, plate: null, isFull: false };
let voiceEnabled = true;
let gpsWatchId = null;

const BUSY_GO = ["大棠黃泥墩","大棠山路巴士站","大棠村迴旋處","群潤花園","曉門","南坑排巴士站","南坑村","紅棗田","水喉頭","崇正公立學校","崇正新村","天龍花園","深涌村","禮修村巴士站","蝶翠峰巴士站","大旗嶺浸信會教堂","富達廣場巴士站","合益路","鳳翔路","大馬路燈位","元朗港鐵站"];

function showToast(msg) {
  const t = document.getElementById('toast');
  if (!t) return alert(msg);
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}

function speakCantonese(text) {
  if (!voiceEnabled || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-HK';
  utter.rate = 0.9;
  window.speechSynthesis.speak(utter);
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

// 1. Google 官方 Firebase 安全 Popup 登入
document.getElementById('login-google').addEventListener('click', function(){
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(async result => {
      const user = result.user;
      const email = user.email;
      currentUser.uid = user.uid;
      currentUser.email = email;
      currentUser.identifier = email;
      currentUser.role = 'admin';

      const dbAdmins = await api.getSuperAdmins();
      const isDbSuper = dbAdmins.some(a => a.email && a.email.toLowerCase() === email.toLowerCase());
      isSuperAdmin = SUPER_ADMIN_EMAILS.some(e => e.toLowerCase() === email.toLowerCase()) || isDbSuper;
      isAdmin = true;

      document.getElementById('login-modal').classList.remove('active');
      document.getElementById('btn-admin-panel').style.display = 'block';

      showToast(`管理員登入成功：${email} ${isSuperAdmin ? '(超級管理員)' : '(普通管理員)'}`);
      speakCantonese('管理員登入成功');
      showView('view-lobby');
    })
    .catch(err => {
      if (err.code === 'auth/popup-closed-by-user') {
        showToast('登入視窗已關閉');
      } else {
        showToast('登入失敗：' + err.message);
      }
    });
});

// 2. 司機與乘客登入
document.getElementById('login-driver').addEventListener('click', function(){
  document.getElementById('login-choice').style.display = 'none';
  document.getElementById('driver-login-form').style.display = 'block';
});
document.getElementById('driver-login-back').addEventListener('click', function(){
  document.getElementById('driver-login-form').style.display = 'none';
  document.getElementById('login-choice').style.display = 'block';
});
document.getElementById('driver-login-btn').addEventListener('click', function(){
  const id = document.getElementById('driver-identifier').value.trim();
  if(!id) return alert("請輸入號碼");
  currentUser.identifier = id;
  currentUser.role = 'driver';
  document.getElementById('login-modal').classList.remove('active');
  showToast('司機登入成功');
  showView('view-lobby');
});

document.getElementById('login-passenger').addEventListener('click', function(){
  document.getElementById('login-choice').style.display = 'none';
  document.getElementById('passenger-login-form').style.display = 'block';
});
document.getElementById('passenger-login-back').addEventListener('click', function(){
  document.getElementById('passenger-login-form').style.display = 'none';
  document.getElementById('login-choice').style.display = 'block';
});
document.getElementById('passenger-login-btn').addEventListener('click', function(){
  const phone = document.getElementById('passenger-phone').value.trim();
  if(!phone) return alert("請輸入電話");
  currentUser.identifier = phone;
  currentUser.role = 'passenger';
  document.getElementById('login-modal').classList.remove('active');
  showToast('乘客登入成功');
  showView('view-lobby');
});

document.getElementById('login-cancel').addEventListener('click', function(){
  document.getElementById('login-modal').classList.remove('active');
});

// 3. 視圖導航
document.getElementById('btn-passenger').addEventListener('click', function(){
  if (!currentUser.identifier){ document.getElementById('login-modal').classList.add('active'); return; }
  showView('view-passenger-list');
  loadBusList();
});
document.getElementById('btn-driver').addEventListener('click', function(){
  if (!currentUser.identifier){ document.getElementById('login-modal').classList.add('active'); return; }
  showView('view-driver');
});
document.getElementById('btn-admin-panel').addEventListener('click', function(){
  if (!isAdmin) return showToast("權限不足");
  showView('view-admin');
  document.getElementById('admin-info-card').innerHTML = `
    <div>登入管理員：<strong>${currentUser.email}</strong></div>
    <div>管理員層級：<strong>${isSuperAdmin ? '👑 超級管理員' : '👁️ 普通管理員'}</strong></div>
  `;
});

document.getElementById('btn-back-list').addEventListener('click', () => showView('view-lobby'));
document.getElementById('btn-back-track').addEventListener('click', () => showView('view-passenger-list'));
document.getElementById('btn-driver-back').addEventListener('click', () => showView('view-lobby'));
document.getElementById('btn-back-admin').addEventListener('click', () => showView('view-lobby'));

document.getElementById('btn-logout').addEventListener('click', function(){
  auth.signOut().catch(console.warn);
  currentUser = { uid: null, identifier: null, role: 'passenger', email: null };
  isAdmin = false; isSuperAdmin = false;
  document.getElementById('btn-admin-panel').style.display = 'none';
  showToast("已安全登出");
  showView('view-lobby');
});

// 4. 線上小巴實時獲取
async function loadBusList() {
  const container = document.getElementById('bus-list-container');
  container.innerHTML = '載入中...';
  const buses = await api.getBuses();
  if (!buses || buses.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#888;">目前沒有線上小巴</div>';
    return;
  }
  container.innerHTML = buses.map(b => `
    <div class="card" style="padding:14px;">
      <div style="font-size:24px;font-weight:bold;color:var(--gold);">🚐 ${b.plate}</div>
      <div style="font-size:17px;color:#ccc;">${b.currentStation||'未知'} · 👥 ${b.passengerCount||0}人</div>
      <button class="btn btn-portal" style="margin-top:8px;font-size:20px;padding:14px;" onclick="trackBus('${b.plate}')">追蹤</button>
    </div>
  `).join('');
}

window.trackBus = function(plate) {
  showView('view-passenger');
  document.getElementById('pass-data-card').innerHTML = `<div style="font-size:24px;color:var(--gold);">🚐 正在即時追蹤車輛：${plate}</div>`;
};

// 5. 司機當值與 GPS 控制
document.getElementById('btn-set-plate').addEventListener('click', function(){
  const plate = document.getElementById('driver-plate-input').value.trim().toUpperCase();
  if(!plate) return showToast("請輸入車牌");
  driverData.plate = plate;
  document.getElementById('d-info').textContent = `🚐 ${plate} | 司機: ${currentUser.identifier}`;
  showToast(`車牌設定成功：${plate}`);
});

document.getElementById('start-gps').addEventListener('click', function(){
  if(!driverData.plate) return showToast("請先設定車牌！");
  driverData.isActive = true;
  document.getElementById('start-gps').style.display = 'none';
  document.getElementById('stop-gps').style.display = 'block';
  api.updateBus({
    plate: driverData.plate,
    currentStation: "大棠黃泥墩",
    passengerCount: driverData.passengerCount,
    isFull: 0,
    lastUpdate: Date.now()
  });
  showToast("🟢 已開始當值，GPS 自動報站已啟動");
});

document.getElementById('stop-gps').addEventListener('click', function(){
  driverData.isActive = false;
  document.getElementById('start-gps').style.display = 'block';
  document.getElementById('stop-gps').style.display = 'none';
  showToast("🔴 已停止當值");
});

document.getElementById('btn-add-pass').addEventListener('click', function(){
  driverData.passengerCount++;
  document.getElementById('d-pass-count').textContent = driverData.passengerCount;
  if(driverData.plate) api.updateBus({ plate: driverData.plate, passengerCount: driverData.passengerCount, lastUpdate: Date.now() });
});

document.getElementById('btn-sub-pass').addEventListener('click', function(){
  if(driverData.passengerCount > 0) driverData.passengerCount--;
  document.getElementById('d-pass-count').textContent = driverData.passengerCount;
  if(driverData.plate) api.updateBus({ plate: driverData.plate, passengerCount: driverData.passengerCount, lastUpdate: Date.now() });
});

// 自動定時輪詢（取代原本 Firebase realtime stream）
setInterval(async () => {
  if (document.getElementById('view-passenger-list').classList.contains('active')) {
    loadBusList();
  }
}, 3000);

console.log('✅ 系統完全升級修復完成');
</script>
